###############################################################################
# BTT Eddy + eddy-ng (TAP flow) — CURRENT STATE (as of 2940861)
# ----------------------------------------------------------------------------
# Mirrors what is already active via config/btteddy-ng.cfg (included in
# printer.cfg). Kept here as a reference / scratchpad, NOT included.
#
# What is already set up (recalibrated 2026-09-15):
#   * [probe_eddy_ng btt_eddy] with calibration v5, two drive currents saved
#     (16 for homing, 17 for tap)
#   * homing_override (Z) -> G28 X Y, move to 125.5/121.5, G28 Z,
#     PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1, G0 Z20
#   * START_PRINT: PROBE_EDDY_NG_TAP at 105.5/105.5, then rapid_scan mesh
#   * END_PRINT: clears tap offset + bed mesh
#
# NOTE: after remounting the sensor at a NEW height, the saved calibration
# curves are INVALID until recalibrated. Do not home Z or tap first.
###############################################################################

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445061204B811C-if00
restart_method: command

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -20
y_offset: -7
reg_drive_current: 16        # homing current (matches saved calibration)
tap_drive_current: 17        # tap current (second curve, reads to 0.0mm)
tap_adjust_z: -0.02          # tuned after paper check at Z=0
# Optional tunables (defaults if omitted):
# home_trigger_height: 2.0   # virtual endstop trigger height
# tap_start_z: 3.2           # <=3.5 so the sensor can read at tap DC
# tap_target_z: -0.250       # max nozzle->bed travel on failed tap
# tap_mode: butter           # more accurate; 'wma' also available
# tap_threshold: 250         # butter default; tune from tap plot

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

[bed_mesh]
horizontal_move_z: 2
speed: 100
mesh_pps: 2,2
mesh_min: 17,27
mesh_max: 185,185
probe_count: 6, 6
algorithm: bicubic

[safe_z_home] # disabled: homing_override in printer.cfg handles Z homing

[homing_override] # lives in printer.cfg (moved out of the BTT stock flow)
axes: z
gcode:
    M117  HOMING O...
    G28 X Y
    G90
    G1 X125.5 Y121.5 F6000    # center the eddy sensor over metal
    G28 Z
    G0 Z2 F1000
    G4 S1
    M400
    PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
    G0 Z20 F1000